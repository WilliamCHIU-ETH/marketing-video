<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 640" role="img" aria-labelledby="marketing-video-current-workflow-title marketing-video-current-workflow-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="marketing-video-current-workflow-title">Marketing Video 現行製作流程</title>
        <desc id="marketing-video-current-workflow-desc">雙泳道流程圖，呈現人員遞交腳本與補充素材，系統加入固定品牌素材、建立工作、呼叫 HeyGen 與 OCR、產生素材配置，交由人員確認，再由 Remotion 合成輸出。</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="640" fill="#f5f5f5"/>

        <rect x="32" y="40" width="1216" height="176" fill="rgba(45,49,66,0.018)"/>
        <rect x="32" y="216" width="1216" height="264" fill="#ffffff"/>
        <line x1="32" y1="40" x2="1248" y2="40" stroke="rgba(45,49,66,0.12)"/>
        <line x1="32" y1="216" x2="1248" y2="216" stroke="rgba(45,49,66,0.20)"/>
        <line x1="32" y1="480" x2="1248" y2="480" stroke="rgba(45,49,66,0.12)"/>
        <line x1="136" y1="40" x2="136" y2="480" stroke="rgba(45,49,66,0.20)"/>

        <text x="84" y="124" fill="#4f5d75" font-family="'Geist Mono','PingFang TC',monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.6">人員</text>
        <text x="84" y="344" fill="#4f5d75" font-family="'Geist Mono','PingFang TC',monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.6">系統</text>

        <!-- Connectors are drawn before nodes. -->
        <path d="M 240 168 V 188 H 384 Q 392 188 392 196 V 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 432 168 V 200 H 440 Q 448 200 448 208 V 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="352" x2="352" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="512" y1="352" x2="544" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="704" y1="352" x2="736" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 896 352 H 912 Q 920 352 920 344 V 168" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 1000 168 V 188 H 1144 Q 1152 188 1152 196 V 304" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Human inputs -->
        <rect x="160" y="72" width="160" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="160" y="72" width="160" height="96" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
        <rect x="172" y="84" width="48" height="16" rx="4" fill="rgba(79,93,117,0.10)" stroke="rgba(79,93,117,0.40)"/>
        <text x="196" y="96" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">HUMAN</text>
        <text x="240" y="124" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">遞交腳本</text>
        <text x="240" y="148" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12" text-anchor="middle">來源不限定</text>

        <rect x="352" y="72" width="160" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="352" y="72" width="160" height="96" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
        <rect x="364" y="84" width="48" height="16" rx="4" fill="rgba(79,93,117,0.10)" stroke="rgba(79,93,117,0.40)"/>
        <text x="388" y="96" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">HUMAN</text>
        <text x="432" y="124" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">提供本片素材</text>
        <text x="432" y="148" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12" text-anchor="middle">截圖、圖片或影片</text>

        <!-- Human review pivot -->
        <rect x="880" y="72" width="160" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="880" y="72" width="160" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="892" y="84" width="48" height="16" rx="4" fill="rgba(235,108,54,0.12)" stroke="rgba(235,108,54,0.48)"/>
        <text x="916" y="96" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">REVIEW</text>
        <text x="960" y="124" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">人工確認配置</text>
        <text x="960" y="148" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12" text-anchor="middle">圖片、時間、框選範圍</text>

        <!-- System steps -->
        <rect x="160" y="304" width="160" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="160" y="304" width="160" height="96" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
        <rect x="172" y="316" width="48" height="16" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.28)"/>
        <text x="196" y="328" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">FIXED</text>
        <text x="240" y="356" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">固定品牌素材包</text>
        <text x="240" y="380" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12" text-anchor="middle">片頭、框架、Logo、BGM</text>

        <rect x="352" y="304" width="160" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="352" y="304" width="160" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="364" y="316" width="40" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.28)"/>
        <text x="384" y="328" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">JOB</text>
        <text x="432" y="356" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">建立製作工作</text>
        <text x="432" y="380" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12" text-anchor="middle">script.txt ＋ 全部素材</text>

        <rect x="544" y="304" width="160" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="544" y="304" width="160" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="556" y="316" width="56" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.28)"/>
        <text x="584" y="328" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">PROCESS</text>
        <text x="624" y="356" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">HeyGen ＋ OCR</text>
        <text x="624" y="380" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12" text-anchor="middle">主播影片與素材辨識</text>

        <rect x="736" y="304" width="160" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="736" y="304" width="160" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="748" y="316" width="40" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.28)"/>
        <text x="768" y="328" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">PLAN</text>
        <text x="816" y="356" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">產生素材配置</text>
        <text x="816" y="380" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12" text-anchor="middle">字幕對齊＋鏡頭計畫</text>

        <rect x="1072" y="304" width="160" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="1072" y="304" width="160" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <rect x="1084" y="316" width="48" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.28)"/>
        <text x="1108" y="328" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">OUTPUT</text>
        <text x="1152" y="356" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600" text-anchor="middle">Remotion 合成</text>
        <text x="1152" y="380" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12" text-anchor="middle">輸出影片並封存</text>

        <!-- Bottom legend -->
        <line x1="32" y1="520" x2="1248" y2="520" stroke="rgba(45,49,66,0.12)"/>
        <text x="32" y="552" fill="#4f5d75" font-family="'Geist Mono','PingFang TC',monospace" font-size="8" letter-spacing="1.6">LEGEND</text>
        <rect x="128" y="540" width="16" height="16" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
        <text x="156" y="552" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">人工輸入</text>
        <rect x="264" y="540" width="16" height="16" rx="4" fill="#ffffff" stroke="#2d3142"/>
        <text x="292" y="552" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">系統處理</text>
        <rect x="400" y="540" width="16" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <text x="428" y="552" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">Human-in-the-Loop</text>
        <text x="32" y="596" fill="#7a8399" font-family="'Geist Mono','PingFang TC',monospace" font-size="12">CURRENT SCOPE · 不含尚未接入主流程的 iOS Simulator 自動截圖實驗</text>
      </svg>
