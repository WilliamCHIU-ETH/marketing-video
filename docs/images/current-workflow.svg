<svg viewBox="0 0 1240 896" role="img" aria-labelledby="cw-title cw-desc" xmlns="http://www.w3.org/2000/svg" width="1240" height="896">
  <title id="cw-title">台股晨報影片產線現況</title>
  <desc id="cw-desc">四層堆疊：人只在遞交晨報 Word 檔、授權付費生成、收下成片這三個點接觸產線；Agent 負責講稿、切段、逐格畫面與組裝等judgment；marketing-video 這一層提供貫穿每一步的規格與介面；最底層是外部依賴，包含付費的 HeyGen 與獨立的 chipk-simulator-capture，後者驅動本機 iOS Simulator。</desc>

  <defs>
    <marker id="cw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b6675"/>
    </marker>
    <marker id="cw-arrow-back" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b6675"/>
    </marker>
    <marker id="cw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0152f5"/>
    </marker>
  </defs>

  <style>
    .n  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-weight:700; fill:#0e1620 }
    .b  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-weight:400; fill:#38434f }
    .m  { font-family:"SF Mono","IBM Plex Mono",ui-monospace,monospace; fill:#5b6675 }
    .mu { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-weight:400; fill:#5b6675 }
  </style>

  <rect width="1240" height="896" fill="#f4f6fa"/>

  <!-- 標題 -->
  <text x="128" y="48" class="n" font-size="20">台股晨報影片產線 — 現況</text>
  <text x="128" y="72" class="mu" font-size="12">工作往下穿過四層，成品往上回到人。2026-08-25</text>

  <!-- 左緣方向指示 -->
  <line x1="72" y1="120" x2="72" y2="760" stroke="#c3ccd8" stroke-width="1" stroke-dasharray="3,4"/>
  <polygon points="68 760, 76 760, 72 772" fill="#c3ccd8"/>
  <text x="56" y="440" class="m" font-size="8" letter-spacing="0.14em" transform="rotate(-90 56 440)" text-anchor="middle">呼叫方向</text>

  <!-- ══ 層間連線（先畫） ══ -->
  <line x1="296" y1="232" x2="296" y2="272" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>
  <line x1="620" y1="240" x2="620" y2="272" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>
  <line x1="620" y1="272" x2="620" y2="240" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>
  <line x1="1000" y1="280" x2="1000" y2="240" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>
  <rect x="1012" y="240" width="88" height="16" rx="2" fill="#f4f6fa"/>
  <text x="1012" y="253" class="mu" font-size="12">成片交回</text>

  <line x1="296" y1="416" x2="296" y2="456" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>
  <rect x="308" y="424" width="132" height="16" rx="2" fill="#f4f6fa"/>
  <text x="308" y="437" class="mu" font-size="12">讀規格・呼叫腳本</text>

  <line x1="296" y1="600" x2="296" y2="640" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>
  <rect x="308" y="608" width="132" height="16" rx="2" fill="#f4f6fa"/>
  <text x="308" y="621" class="mu" font-size="12">釘版本・定義介面</text>

  <!-- ══ 01 人 ══ -->
  <rect x="128" y="96" width="1040" height="136" rx="6" fill="#ffffff" stroke="#c3ccd8" stroke-width="1"/>
  <text x="148" y="124" class="m" font-size="8" letter-spacing="0.14em">01</text>
  <text x="180" y="126" class="n" font-size="16">人</text>
  <text x="1148" y="126" class="mu" font-size="12" text-anchor="end">整條線只碰三次</text>

  <rect x="176" y="144" width="240" height="64" rx="6" fill="rgba(91,102,117,0.08)" stroke="#8a94a2" stroke-width="1"/>
  <text x="296" y="172" class="n" font-size="16" text-anchor="middle">① 遞交晨報</text>
  <text x="296" y="194" class="m" font-size="12" text-anchor="middle">.docx</text>

  <rect x="520" y="144" width="200" height="64" rx="6" fill="rgba(168,67,13,0.06)" stroke="#a8430d" stroke-width="1"/>
  <rect x="532" y="152" width="36" height="16" rx="2" fill="none" stroke="rgba(168,67,13,0.55)" stroke-width="0.8"/>
  <text x="550" y="164" class="m" font-size="8" fill="#a8430d" text-anchor="middle" letter-spacing="0.06em">付費</text>
  <text x="620" y="188" class="n" font-size="16" text-anchor="middle">② 付費授權</text>

  <rect x="880" y="144" width="240" height="64" rx="6" fill="rgba(91,102,117,0.08)" stroke="#8a94a2" stroke-width="1"/>
  <text x="1000" y="172" class="n" font-size="16" text-anchor="middle">③ 收下成片</text>
  <text x="1000" y="194" class="m" font-size="12" text-anchor="middle">1080×1920 MP4</text>

  <!-- ══ 02 Agent ══ -->
  <rect x="128" y="280" width="1040" height="136" rx="6" fill="#ffffff" stroke="#c3ccd8" stroke-width="1"/>
  <text x="148" y="308" class="m" font-size="8" letter-spacing="0.14em">02</text>
  <text x="180" y="310" class="n" font-size="16">Agent（Claude Code）</text>
  <text x="1148" y="310" class="mu" font-size="12" text-anchor="end">判斷都在這一層・定格驗收會自動退回重畫</text>

  <rect x="176" y="332" width="204" height="60" rx="6" fill="rgba(14,22,32,0.04)" stroke="#5b6675" stroke-width="1"/>
  <text x="278" y="368" class="n" font-size="16" text-anchor="middle">寫講稿</text>
  <line x1="380" y1="360" x2="420" y2="360" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>

  <rect x="428" y="332" width="204" height="60" rx="6" fill="rgba(14,22,32,0.04)" stroke="#5b6675" stroke-width="1"/>
  <text x="530" y="368" class="n" font-size="16" text-anchor="middle">切段</text>
  <line x1="632" y1="360" x2="672" y2="360" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>

  <rect x="680" y="332" width="204" height="60" rx="6" fill="rgba(14,22,32,0.04)" stroke="#5b6675" stroke-width="1"/>
  <text x="782" y="360" class="n" font-size="16" text-anchor="middle">逐格畫面</text>
  <text x="782" y="380" class="mu" font-size="12" text-anchor="middle">＋定格驗收</text>
  <line x1="884" y1="360" x2="924" y2="360" stroke="#5b6675" stroke-width="1.2" marker-end="url(#cw-arrow)"/>

  <rect x="932" y="332" width="204" height="60" rx="6" fill="rgba(14,22,32,0.04)" stroke="#5b6675" stroke-width="1"/>
  <text x="1034" y="368" class="n" font-size="16" text-anchor="middle">組裝</text>

  <!-- ══ 03 marketing-video（焦點層） ══ -->
  <rect x="128" y="464" width="1040" height="136" rx="6" fill="rgba(1,82,245,0.05)" stroke="#0152f5" stroke-width="1.2"/>
  <text x="148" y="492" class="m" font-size="8" letter-spacing="0.14em" fill="#0152f5">03</text>
  <text x="180" y="494" class="n" font-size="16" fill="#0152f5">marketing-video</text>
  <text x="1148" y="494" class="mu" font-size="12" text-anchor="end" fill="#0152f5">我建的：讓每一步都可重複的規格與介面</text>

  <line x1="148" y1="512" x2="1148" y2="512" stroke="rgba(1,82,245,0.22)" stroke-width="1"/>

  <text x="180" y="544" class="b" font-size="12">腳本規則・時長換算</text>
  <text x="392" y="544" class="b" font-size="12">切段規則</text>
  <text x="524" y="544" class="b" font-size="12">四層畫面格式＋版位常數</text>
  <text x="836" y="544" class="b" font-size="12">付費 ledger 與追溯</text>

  <text x="180" y="576" class="b" font-size="12">出片前台（可選的人工審核）</text>
  <text x="524" y="576" class="b" font-size="12">專案目錄・版型層・組裝腳本</text>
  <text x="836" y="576" class="n" font-size="12" fill="#0152f5">★ CLI Port／Adapter</text>

  <line x1="376" y1="528" x2="376" y2="588" stroke="rgba(1,82,245,0.18)" stroke-width="1"/>
  <line x1="508" y1="528" x2="508" y2="588" stroke="rgba(1,82,245,0.18)" stroke-width="1"/>
  <line x1="820" y1="528" x2="820" y2="588" stroke="rgba(1,82,245,0.18)" stroke-width="1"/>

  <!-- ══ 04 外部依賴 ══ -->
  <rect x="128" y="648" width="1040" height="136" rx="6" fill="#ffffff" stroke="#c3ccd8" stroke-width="1"/>
  <text x="148" y="676" class="m" font-size="8" letter-spacing="0.14em">04</text>
  <text x="180" y="678" class="n" font-size="16">外部依賴</text>
  <text x="1148" y="678" class="mu" font-size="12" text-anchor="end">marketing-video 不擁有，只釘版本並定義怎麼呼叫</text>

  <rect x="176" y="696" width="472" height="64" rx="6" fill="rgba(91,102,117,0.08)" stroke="#8a94a2" stroke-width="1"/>
  <rect x="188" y="704" width="52" height="16" rx="2" fill="none" stroke="rgba(168,67,13,0.55)" stroke-width="0.8"/>
  <text x="214" y="716" class="m" font-size="8" fill="#a8430d" text-anchor="middle" letter-spacing="0.06em">第三方</text>
  <text x="252" y="717" class="n" font-size="16">HeyGen</text>
  <text x="188" y="744" class="mu" font-size="12">付費，回傳 Avatar 主播影片</text>

  <rect x="672" y="696" width="448" height="64" rx="6" fill="rgba(1,82,245,0.05)" stroke="#0152f5" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="684" y="704" width="76" height="16" rx="2" fill="none" stroke="rgba(1,82,245,0.45)" stroke-width="0.8"/>
  <text x="722" y="716" class="m" font-size="8" fill="#0152f5" text-anchor="middle" letter-spacing="0.06em">我的另一個</text>
  <text x="772" y="717" class="n" font-size="16">chipk-simulator-capture</text>
  <text x="684" y="744" class="mu" font-size="12">驅動本機 iOS Simulator 取得實機截圖</text>

  <!-- ══ 圖例 ══ -->
  <line x1="128" y1="824" x2="1168" y2="824" stroke="rgba(14,22,32,0.12)" stroke-width="0.8"/>
  <text x="128" y="852" class="m" font-size="8" letter-spacing="0.14em">圖例</text>

  <rect x="196" y="840" width="20" height="16" rx="3" fill="rgba(1,82,245,0.07)" stroke="#0152f5" stroke-width="1"/>
  <text x="228" y="853" class="mu" font-size="12">我建的東西</text>

  <rect x="360" y="840" width="20" height="16" rx="3" fill="none" stroke="rgba(168,67,13,0.55)" stroke-width="0.8"/>
  <text x="392" y="853" class="mu" font-size="12">要花錢的環節</text>

  <rect x="536" y="840" width="20" height="16" rx="3" fill="rgba(91,102,117,0.08)" stroke="#8a94a2" stroke-width="1"/>
  <text x="568" y="853" class="mu" font-size="12">別人的東西</text>

  <text x="720" y="853" class="mu" font-size="12">★ 兩個 repo 的唯一接觸面</text>
</svg>
